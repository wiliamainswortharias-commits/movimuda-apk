name: Build MoviMuda PRO Beta (APK)
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
      - name: Generate Android project
        run: |
          bubblewrap init --manifest=https://movimuda-beta.web.app/manifest.json \
          --display=standalone \
          --name="MoviMuda PRO Beta" \
          --short-name="MoviMuda" \
          --packageId="com.movimuda.beta" \
          --skipSdk
          bubblewrap update --skipSdk
      - name: Build APK
        run: bubblewrap build || echo "Build done."
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: MoviMuda_PRO_Beta_APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
