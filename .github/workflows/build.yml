name: build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias necesarias
        run: |
          npm install -g @bubblewrap/cli

      - name: Inicializar proyecto TWA automáticamente
        run: |
          echo "Creando proyecto TWA sin interacción..."
          yes "" | bubblewrap init --manifest=https://tusitio.com/manifest.json

      - name: Construir APK (release)
        run: |
          bubblewrap build

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: ./app-release-signed.apk
