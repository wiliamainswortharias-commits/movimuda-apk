name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: |
          npm install -g @bubblewrap/cli
          npm ci

      - name: Inicializar proyecto TWA
        run: |
          mkdir -p twa
          cd twa
          bubblewrap init --manifest=https://movimuda.web.app/manifest.json --skipPwaValidation --directory=. --appVersionName=1.0.0 --appVersionCode=1
          bubblewrap build
        env:
          BROWSER: none

      - name: Construir APK (release)
        run: |
          cd twa
          if [ -f ./app-release-signed.apk ]; then
            mv app-release-signed.apk ../movimuda-apk.apk
          elif [ -f ./app-release.apk ]; then
            mv app-release.apk ../movimuda-apk.apk
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: movimuda-apk
          path: movimuda-apk.apk
