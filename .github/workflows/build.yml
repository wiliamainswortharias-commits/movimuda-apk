name: Build, Sign and Publish TWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3️⃣ Instalar Bubblewrap CLI globalmente
      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli

      # 4️⃣ Crear carpeta TWA y generar el proyecto desde el manifest
      - name: Construir TWA desde manifest
        run: |
          mkdir -p twa
          cd twa
          echo "Inicializando proyecto desde manifest..."
          bubblewrap init \
            --manifest=https://movimuda.web.app/manifest.json \
            --skipPwaValidation \
            --directory=. \
            --appVersionName=1.0.$GITHUB_RUN_NUMBER \
            --appVersionCode=$GITHUB_RUN_NUMBER
          echo "Compilando APK..."
          bubblewrap build
        env:
          BROWSER: none

      # 5️⃣ Restaurar el keystore desde secreto
      - name: Restaurar keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 6️⃣ Firmar y alinear el APK
      - name: Firmar el APK
        run: |
          cd twa
          echo "Firmando APK..."
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore ../my-release-key.jks \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            app-release.apk ${{ secrets.KEY_ALIAS }}
          echo "Alineando APK..."
          zipalign -v 4 app-release.apk app-release-signed.apk
          mv app-release-signed.apk ../movimuda-apk.apk

      # 7️⃣ Subir el artefacto (para descargar manualmente si lo deseas)
      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: movimuda-apk-signed
          path: movimuda-apk.apk

      # 8️⃣ Publicar en Google Play (track interno)
      - name: Publicar en Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ secrets.PACKAGE_NAME }}
          releaseFiles: movimuda-apk.apk
          track: internal
          status: completed
