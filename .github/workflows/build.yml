name: Build MoviMuda PRO Beta (APK)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📦 Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: 🏗️ Generate Android project (auto-confirm)
        run: |
          yes "" | bubblewrap init --manifest=https://movimuda.web.app/manifest.json
          bubblewrap build

      - name: 📤 Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: MoviMudaPRO-Beta
          path: ./output/app-release-signed.apk
