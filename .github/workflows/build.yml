name: Build and Sign TWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias base
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          npm install -g @bubblewrap/cli

      - name: Construir TWA desde manifest
        run: |
          mkdir -p twa
          cd twa
          bubblewrap init --manifest=https://TU_DOMINIO/manifest.json --jdk "system" --directory .
          bubblewrap build

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa/app-release.apk
